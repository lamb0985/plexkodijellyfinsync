    .pkjs-app {

    .pkjs-app .bar span { display:block; width:var(--progress); height:100%; background:var(--platform); }
    .pkjs-app .section-label { margin:3px 0 -8px; color:var(--cyan); text-transform:uppercase; font-size:12px; font-weight:800; letter-spacing:.1em; }
    .pkjs-app .item-title { font-size:16px; font-weight:750; }
    .pkjs-app .path { overflow-wrap:anywhere; font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace; color:var(--muted); margin-top:4px; }
    .pkjs-app .note { border-left:3px solid var(--orange); padding:11px 14px; background:rgba(255,184,108,.06); color:var(--text); border-radius:8px; margin:0; }
    .pkjs-app textarea { display:block; min-height:260px; resize:vertical; white-space:pre; font:13px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace; margin:12px 0; }
    .pkjs-app .toast { color:var(--green); font-size:13px; min-height:18px; }
    .pkjs-app [hidden] { display:none!important; }
    @media(max-width:820px) {
      .pkjs-app .overview { grid-template-columns:repeat(2,minmax(0,1fr)); }

    }

      .pkjs-app .platforms { grid-template-columns:1fr; }
      .pkjs-app h1 { font-size:23px; }
      .pkjs-app .logo-frame { width:50px; height:50px; }
      .pkjs-app .logo-frame img { width:38px; height:38px; }
      .pkjs-app .button { min-height:44px; }
    }
  
html,body{margin:0;min-height:100%;background:#282a36}

</style></head><body>
<div class="pkjs-app">
<header class="top"><div class="brand"><div class="logo-frame"><img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2232%22%20height%3D%2232%22%20viewBox%3D%220%200%2032%2032%22%20role%3D%22img%22%20aria-labelledby%3D%22title%22%3E%0A%20%20%3Ctitle%20id%3D%22title%22%3EPlex%20Kodi%20Jellyfin%20Sync%20icon%3C%2Ftitle%3E%0A%20%20%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%23101827%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%2211.3%22%20fill%3D%22none%22%20stroke%3D%22%23253247%22%20stroke-width%3D%223%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M16%204.7a11.3%2011.3%200%200%201%209.8%205.65%22%20fill%3D%22none%22%20stroke%3D%22%23e5a72d%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M25.8%2021.65A11.3%2011.3%200%200%201%206.2%2021.65%22%20fill%3D%22none%22%20stroke%3D%22%238e69de%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M6.2%2010.35A11.3%2011.3%200%200%201%2011.6%205.6%22%20fill%3D%22none%22%20stroke%3D%22%2331a5df%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M13%2010.7%2021.5%2016%2013%2021.3Z%22%20fill%3D%22%23f5f8ff%22%2F%3E%0A%3C%2Fsvg%3E%0A" width="48" height="48" alt="Plex Kodi Jellyfin Sync logo"></div><div><div class="eyebrow">Plex · Kodi · Jellyfin</div><h1>Sync Dashboard</h1></div></div><div class="header-actions"><button class="button primary" onclick="syncNow()">Sync now</button><button class="button danger" onclick="resetSync()">Reset</button><button class="button subtle" onclick="toggleStatus()">Status</button></div></header>
<nav class="nav" aria-label="Pages"><a class="active" href="/" aria-current="page">Dashboard</a><a href="/tracker">Tracker</a><a href="/env">Environment</a></nav>
<main><section class="overview" aria-label="Sync overview"><article class="card metric"><span class="label">Tracked items</span><strong id="trackedCount">—</strong><small>Saved sync state</small></article><article class="card metric"><span class="label">Movies</span><strong id="movieCount">—</strong><small>In progress</small></article><article class="card metric"><span class="label">Shows</span><strong id="showCount">—</strong><small>In progress</small></article><article class="card metric"><span class="label">On Deck</span><strong id="onDeckCount">—</strong><small>Episodes up next</small></article></section>
<section class="card"><div class="section-head"><div><h2>Activity</h2><p>Playback progress across Plex, Kodi, and Jellyfin.</p></div><span class="badge">Live log</span></div><div class="log-head"><span class="label">Live Logs</span><button class="text-button" type="button" onclick="document.getElementById('terminal').scrollTop=document.getElementById('terminal').scrollHeight">Jump to latest</button></div><div id="terminal" class="log" role="log" aria-live="off">Connecting to logs…</div><label for="cmdinput" class="label" style="display:block;margin-top:14px">Command</label><input id="cmdinput" class="terminal-input" placeholder="Type command and press Enter" autocomplete="off"></section>
<section id="statusBoxWrapper" class="card status-panel"><div class="section-head"><h2>Sync Status</h2><button class="button" id="copyBtn" onclick="copyStatus()">Copy</button></div><pre><code id="statusBox" class="json">No status yet.</code></pre></section></main></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.min.js"></script>
 <script>
 const termBox = document.getElementById("terminal");
 const socket = io();
 const ansiColors = [
  "#21222c", "#ff5555", "#50fa7b", "#f1fa8c",
  "#bd93f9", "#ff79c6", "#8be9fd", "#f8f8f2",
  "#6272a4", "#ff6e6e", "#69ff94", "#ffffa5",
  "#d6acff", "#ff92df", "#a4ffff", "#ffffff"
 ];
 const ansiControl = /\x1b(?:\[([0-?]*[ -/]*)([@-~])|\][\s\S]*?(?:\x07|\x1b\\))/g;
 let ansiStyle = {};
 let logStarted = false;

 function paletteColor(index) {
  if (index < 16) return ansiColors[index];
  if (index < 232) {
   const n = index - 16;
   const levels = [0, 95, 135, 175, 215, 255];
   return "rgb(" + [Math.floor(n / 36), Math.floor(n / 6) % 6, n % 6]
    .map(part => levels[part]).join(",") + ")";
  }
  const gray = 8 + (index - 232) * 10;
  return "rgb(" + gray + "," + gray + "," + gray + ")";
 }

 function applySgr(parameters) {
  const codes = parameters ? parameters.replace(/:/g, ";").split(";").map(Number) : [0];
  for (let i = 0; i < codes.length; i++) {
   const code = codes[i];
   if (code === 0) ansiStyle = {};
   else if (code === 1) ansiStyle.bold = true;
   else if (code === 2) ansiStyle.dim = true;
   else if (code === 3) ansiStyle.italic = true;
   else if (code === 4) ansiStyle.underline = true;
   else if (code === 22) { ansiStyle.bold = false; ansiStyle.dim = false; }
   else if (code === 23) ansiStyle.italic = false;
   else if (code === 24) ansiStyle.underline = false;
   else if (code === 39) delete ansiStyle.color;
   else if (code === 49) delete ansiStyle.background;
   else if (code >= 30 && code <= 37) ansiStyle.color = ansiColors[code - 30];
   else if (code >= 90 && code <= 97) ansiStyle.color = ansiColors[code - 90 + 8];
   else if (code >= 40 && code <= 47) ansiStyle.background = ansiColors[code - 40];
   else if (code >= 100 && code <= 107) ansiStyle.background = ansiColors[code - 100 + 8];
   else if ((code === 38 || code === 48) && codes[i + 1] === 2 && i + 4 < codes.length) {
    const rgb = codes.slice(i + 2, i + 5).map(n => Math.max(0, Math.min(255, n)));
    ansiStyle[code === 38 ? "color" : "background"] = "rgb(" + rgb.join(",") + ")";
    i += 4;
   } else if ((code === 38 || code === 48) && codes[i + 1] === 5 && i + 2 < codes.length) {
    ansiStyle[code === 38 ? "color" : "background"] = paletteColor(codes[i + 2]);
    i += 2;
   }
  }
 }

 function appendStyledText(parent, value) {
  if (!value) return;
  const span = document.createElement("span");
  span.textContent = value;
  if (ansiStyle.color) span.style.color = ansiStyle.color;
  if (ansiStyle.background) span.style.backgroundColor = ansiStyle.background;
  if (ansiStyle.bold) span.style.fontWeight = "bold";
  if (ansiStyle.dim) span.style.opacity = "0.7";
  if (ansiStyle.italic) span.style.fontStyle = "italic";
  if (ansiStyle.underline) span.style.textDecoration = "underline";
  parent.appendChild(span);
 }

 function appendLog(data) {
  if (!logStarted) { termBox.textContent = ""; logStarted = true; }
  const lines = String(data).replace(/\r\n/g, "\n").replace(/\r/g, "").split("\n");
  if (lines.length > 1 && lines[lines.length - 1] === "") lines.pop();
  for (const line of lines) {
   const row = document.createElement("div");
   row.className = "log-line";
   let start = 0;
   ansiControl.lastIndex = 0;
   for (const match of line.matchAll(ansiControl)) {
    appendStyledText(row, line.slice(start, match.index));
    if (match[2] === "m") applySgr(match[1]);
    start = match.index + match[0].length;
   }
   appendStyledText(row, line.slice(start));
   termBox.appendChild(row);
  }
  while (termBox.childElementCount > 1000) termBox.removeChild(termBox.firstElementChild);
  termBox.scrollTop = termBox.scrollHeight;
 }

 function logColumns() {
  const style = getComputedStyle(termBox);
  const canvas = document.createElement("canvas");
  const context = canvas.getContext("2d");
  if (!context) return 80;
  context.font = style.font;
  const characterWidth = Math.max(1, context.measureText("M").width);
  const available = termBox.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
  return Math.max(60, Math.min(240, Math.floor(available / characterWidth) - 1));
 }

 function reportLogWidth() { socket.emit("log_width", logColumns()); }
 socket.on("connect", reportLogWidth);
 if (window.ResizeObserver) new ResizeObserver(reportLogWidth).observe(termBox);
 else window.addEventListener("resize", reportLogWidth);
 async function refreshLog() {
  const previousTop = termBox.scrollTop;
  const nearBottom = termBox.scrollHeight - previousTop - termBox.clientHeight < 60;
  try {
   const response = await fetch("/api/logs", { cache: "no-store", credentials: "include" });
   if (!response.ok) throw new Error("HTTP " + response.status);
   const snapshot = await response.text();
   if (!snapshot) { termBox.textContent = "No log output yet."; logStarted = false; return; }
   if (snapshot === lastSnapshot) return;
   lastSnapshot = snapshot;
   termBox.textContent = "";
   ansiStyle = {};
   logStarted = true;
   appendLog(snapshot);
   if (!nearBottom) termBox.scrollTop = previousTop;
   fetchStatus();
  } catch (error) {
   if (!logStarted) termBox.textContent = "Unable to load logs: " + error.message;
  }
 }
 let lastSnapshot = "";
 refreshLog();
 setInterval(refreshLog, 5000);
 document.getElementById("cmdinput").addEventListener("keypress", e => {
 if (e.key === "Enter") {
 socket.emit("run_cmd", e.target.value);
 e.target.value = "";
 }
 });
 socket.on("cmd_output", () => { setTimeout(refreshLog, 250); });
 function updateSummary(data) {
 const entries = Object.values(data.data || {});
 const kinds = {movies:0,shows:0,onDeck:0};
 entries.forEach(entry => {
  const platforms = [entry.plex,entry.kodi,entry.jellyfin].filter(Boolean);
  const episode = platforms.some(p => p.media_type === "episode");
  const movie = platforms.some(p => p.media_type === "movie");
  const inProgress = platforms.some(p => Number(p.resume || 0) > 0 && p.status !== "watched");
  if (inProgress && movie) kinds.movies++;
  if (inProgress && episode) kinds.shows++;
  if (episode && !inProgress && platforms.some(p => p.status === "unwatched") && platforms.every(p => p.status !== "watched")) kinds.onDeck++;
 });
 document.getElementById("trackedCount").textContent = entries.length;
 document.getElementById("movieCount").textContent = kinds.movies;
 document.getElementById("showCount").textContent = kinds.shows;
 document.getElementById("onDeckCount").textContent = kinds.onDeck;
 }
 function fetchStatus() {
 fetch('/status', { credentials: 'include' })
 .then(r => r.json())
 .then(data => {
 updateSummary(data);
 document.getElementById("statusBox").textContent = JSON.stringify(data, null, 2);
 hljs.highlightElement(document.getElementById("statusBox"));
 });
 }
 function syncNow() { fetch('/sync?columns=' + logColumns(), { credentials: 'include' }).then(fetchStatus); }
 function resetSync() { fetch('/reset?columns=' + logColumns(), { credentials: 'include' }).then(fetchStatus); }
 function toggleStatus() {
 const w = document.getElementById("statusBoxWrapper");
 if (!w.classList.contains("open")) {
 w.classList.add("open");
 fetchStatus();
 } else w.classList.remove("open");
 }
 function tracker() { window.location.href = "/tracker"; }
 function copyStatus() { navigator.clipboard.writeText(document.getElementById("statusBox").textContent); }
 fetchStatus();
 </script>
