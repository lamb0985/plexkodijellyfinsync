<!DOCTYPE html>
<html>
 <head>
 <meta charset="UTF-8">
 <title>Plex Kodi Jellyfin Sync</title>
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
 <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
 <script>hljs.highlightAll();</script>
<style>
body {
    font-family: 'Inter', monospace, sans-serif;
    background: #0d0e15;
    color: #f8f8f2;
    display: flex;
    justify-content: center;
    align-items: stretch;
    width: 100%;
    height: 100vh;
    margin: 0;
    padding: 0;
}

.container {
    width: 100%;
    height: 100%;
    max-width: none;
    background: #141622;
    border: 1px solid #2e3450;
    border-radius: 0;
    box-sizing: border-box;
    padding: 24px;
    display: flex;
    flex-direction: column;
    box-shadow: none;
}

h1 {
    color: #50FA7B;
    text-align: center;
}
h3 {
    color: #FFFFFF;
}

button {
    padding: 8px 16px;
    margin: 4px;
    background: rgba(255,255,255,0.05);
    color: #f8f8f2;
    border: 1px solid #2e3450;
    border-radius: 8px;
    cursor: pointer;
    transition: all .2s ease;
}

button:hover {
    background: rgba(255,255,255,0.1);
    border-color: #949eb4;
}

input {
    background: #1e2235;
    color: #f8f8f2;
    border: 1px solid #2e3450;
    border-radius: 8px;
    box-sizing: border-box;
}

#terminal {
    flex: 1;
    min-height: 0;
    min-width: 0;
    width: 100%;
    margin: 0;
    padding: 12px;
    background: #1e2235;
    color: #f8f8f2;
    border: 1px solid #2e3450;
    border-radius: 8px;
    box-sizing: border-box;
    overflow: auto;
    white-space: pre;
    font: 14px/1.25 ui-monospace, SFMono-Regular, Consolas, monospace;
}

input::placeholder {
    color: #6272a4;
}

.log-line {
    min-height: 1.25em;
}

pre {
    background: #1e2235;
    border: 1px solid #2e3450;
    border-radius: 8px;
    padding: 12px;
    overflow: auto;
}

::-webkit-scrollbar {
    width: 8px;
}

::-webkit-scrollbar-track {
    background: transparent;
}

::-webkit-scrollbar-thumb {
    background: #2e3450;
    border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
    background: #6272a4;
}
.button-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin: 16px 0;
}
</style>
 </head>
 <body>
 <div class="container">
 <h1>Plex Kodi Jellyfin Sync Dashboard</h1>
    <div class="button-row">
        <button onclick="syncNow()">Sync</button>
        <button onclick="resetSync()">Reset</button>
        <button onclick="toggleStatus()">Status</button>
        <button onclick="tracker()">Tracker</button>
        <button onclick="window.location.href='/env'">Environment</button>
    </div>
 <h3>Live Logs</h3>

<div id="terminal" role="log" aria-live="off">Connecting to logs…</div>

<input
    id="cmdinput"
    placeholder="Type command and press Enter"
    style="width:100%; padding:8px; margin-top:8px;"
/>

<div id="statusBoxWrapper" style="display:none; margin-top:20px; text-align:left;">
 <h3>Sync Status <button id="copyBtn" onclick="copyStatus()">Copy</button></h3>
 <pre><code id="statusBox" class="json">No status yet.</code></pre>
 </div>
 </div>
 <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.min.js"></script>
 <script>
 const termBox = document.getElementById("terminal");
 const socket = io();
 const ansiColors = [
  "#21222c", "#ff5555", "#50fa7b", "#f1fa8c",
  "#bd93f9", "#ff79c6", "#8be9fd", "#f8f8f2",
  "#6272a4", "#ff6e6e", "#69ff94", "#ffffa5",
  "#d6acff", "#ff92df", "#a4ffff", "#ffffff"
 ];
 const ansiControl = /\x1b(?:\[([0-?]*[ -/]*)([@-~])|\][\s\S]*?(?:\x07|\x1b\\))/g;
 let ansiStyle = {};
 let logStarted = false;

 function paletteColor(index) {
  if (index < 16) return ansiColors[index];
  if (index < 232) {
   const n = index - 16;
   const levels = [0, 95, 135, 175, 215, 255];
   return "rgb(" + [Math.floor(n / 36), Math.floor(n / 6) % 6, n % 6]
    .map(part => levels[part]).join(",") + ")";
  }
  const gray = 8 + (index - 232) * 10;
  return "rgb(" + gray + "," + gray + "," + gray + ")";
 }

 function applySgr(parameters) {
  const codes = parameters ? parameters.replace(/:/g, ";").split(";").map(Number) : [0];
  for (let i = 0; i < codes.length; i++) {
   const code = codes[i];
   if (code === 0) ansiStyle = {};
   else if (code === 1) ansiStyle.bold = true;
   else if (code === 2) ansiStyle.dim = true;
   else if (code === 3) ansiStyle.italic = true;
   else if (code === 4) ansiStyle.underline = true;
   else if (code === 22) { ansiStyle.bold = false; ansiStyle.dim = false; }
   else if (code === 23) ansiStyle.italic = false;
   else if (code === 24) ansiStyle.underline = false;
   else if (code === 39) delete ansiStyle.color;
   else if (code === 49) delete ansiStyle.background;
   else if (code >= 30 && code <= 37) ansiStyle.color = ansiColors[code - 30];
   else if (code >= 90 && code <= 97) ansiStyle.color = ansiColors[code - 90 + 8];
   else if (code >= 40 && code <= 47) ansiStyle.background = ansiColors[code - 40];
   else if (code >= 100 && code <= 107) ansiStyle.background = ansiColors[code - 100 + 8];
   else if ((code === 38 || code === 48) && codes[i + 1] === 2 && i + 4 < codes.length) {
    const rgb = codes.slice(i + 2, i + 5).map(n => Math.max(0, Math.min(255, n)));
    ansiStyle[code === 38 ? "color" : "background"] = "rgb(" + rgb.join(",") + ")";
    i += 4;
   } else if ((code === 38 || code === 48) && codes[i + 1] === 5 && i + 2 < codes.length) {
    ansiStyle[code === 38 ? "color" : "background"] = paletteColor(codes[i + 2]);
    i += 2;
   }
  }
 }

 function appendStyledText(parent, value) {
  if (!value) return;
  const span = document.createElement("span");
  span.textContent = value;
  if (ansiStyle.color) span.style.color = ansiStyle.color;
  if (ansiStyle.background) span.style.backgroundColor = ansiStyle.background;
  if (ansiStyle.bold) span.style.fontWeight = "bold";
  if (ansiStyle.dim) span.style.opacity = "0.7";
  if (ansiStyle.italic) span.style.fontStyle = "italic";
  if (ansiStyle.underline) span.style.textDecoration = "underline";
  parent.appendChild(span);
 }

 function appendLog(data) {
  if (!logStarted) { termBox.textContent = ""; logStarted = true; }
  const lines = String(data).replace(/\r\n/g, "\n").replace(/\r/g, "").split("\n");
  if (lines.length > 1 && lines[lines.length - 1] === "") lines.pop();
  for (const line of lines) {
   const row = document.createElement("div");
   row.className = "log-line";
   let start = 0;
   ansiControl.lastIndex = 0;
   for (const match of line.matchAll(ansiControl)) {
    appendStyledText(row, line.slice(start, match.index));
    if (match[2] === "m") applySgr(match[1]);
    start = match.index + match[0].length;
   }
   appendStyledText(row, line.slice(start));
   termBox.appendChild(row);
  }
  while (termBox.childElementCount > 1000) termBox.removeChild(termBox.firstElementChild);
  termBox.scrollTop = termBox.scrollHeight;
 }

 function logColumns() {
  const style = getComputedStyle(termBox);
  const canvas = document.createElement("canvas");
  const context = canvas.getContext("2d");
  if (!context) return 80;
  context.font = style.font;
  const characterWidth = Math.max(1, context.measureText("M").width);
  const available = termBox.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
  return Math.max(60, Math.min(240, Math.floor(available / characterWidth) - 1));
 }

 function reportLogWidth() { socket.emit("log_width", logColumns()); }
 socket.on("connect", reportLogWidth);
 if (window.ResizeObserver) new ResizeObserver(reportLogWidth).observe(termBox);
 else window.addEventListener("resize", reportLogWidth);
 socket.on("log_update", appendLog);
 document.getElementById("cmdinput").addEventListener("keypress", e => {
 if (e.key === "Enter") {
 socket.emit("run_cmd", e.target.value);
 e.target.value = "";
 }
 });
 socket.on("cmd_output", appendLog);
 function fetchStatus() {
 fetch('/status', { credentials: 'include' })
 .then(r => r.json())
 .then(data => {
 document.getElementById("statusBox").textContent = JSON.stringify(data, null, 2);
 hljs.highlightElement(document.getElementById("statusBox"));
 });
 }
 function syncNow() { fetch('/sync?columns=' + logColumns(), { credentials: 'include' }).then(fetchStatus); }
 function resetSync() { fetch('/reset?columns=' + logColumns(), { credentials: 'include' }).then(fetchStatus); }
 function toggleStatus() {
 const w = document.getElementById("statusBoxWrapper");
 if (w.style.display === "none") {
 w.style.display = "block";
 fetchStatus();
 } else w.style.display = "none";
 }
 function tracker() { window.location.href = "/tracker"; }
 function copyStatus() { navigator.clipboard.writeText(document.getElementById("statusBox").textContent); }
 </script>
 </body>
</html>
