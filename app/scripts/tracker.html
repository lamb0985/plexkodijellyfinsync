<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plex Kodi Jellyfin Sync Tracker</title>
    <!-- Essential Fonts & Media Icons -->
    <link rel="stylesheet" href="https://googleapis.com">
    <link rel="stylesheet" href="https://cloudflare.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>:root{color-scheme:dark;--bg:#282a36;--panel:#21222c;--border:#44475a;--text:#f8f8f2;--muted:#b2b7cf;--purple:#bd93f9;--cyan:#8be9fd;--good:#50fa7b;--warn:#ffb86c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
body{background:radial-gradient(circle at top right,rgba(189,147,249,.12),transparent 28%),linear-gradient(180deg,#252733,var(--bg) 170px)}
.fullscreen-panel{width:100%;min-width:0;margin:0;padding:23px 26px 50px}
.panel-title{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:8px 0 22px}
.brand{display:flex;align-items:center;gap:14px}.logo-frame{width:58px;height:58px;display:grid;place-items:center;border:1px solid rgba(189,147,249,.34);border-radius:15px;background:linear-gradient(145deg,#393c50,#222432);box-shadow:0 8px 22px rgba(0,0,0,.24)}.logo-frame img{width:44px;height:44px}
.eyebrow{color:var(--cyan);font-size:12px;font-weight:800;letter-spacing:.15em;text-transform:uppercase}h1{font-size:27px;line-height:1.2;margin:3px 0 0}
.btn-refresh{padding:10px 14px;border-radius:10px;border:1px solid rgba(98,114,164,.45);background:linear-gradient(#36384a,#2a2d3c);color:var(--text);text-decoration:none;font:700 14px system-ui;cursor:pointer}
.media-status-list{display:flex;flex-direction:column;gap:14px}.section-header{margin:12px 0 0;padding:0 2px;color:var(--cyan);text-transform:uppercase;letter-spacing:.1em;font-size:13px;font-weight:800}
.section-header.inprogress{color:var(--warn)}.section-header.upnext{color:var(--good)}
.media-row{border:1px solid rgba(98,114,164,.28);border-radius:14px;padding:18px;background:linear-gradient(180deg,rgba(52,55,70,.3),rgba(33,34,44,.98));box-shadow:0 12px 28px rgba(0,0,0,.18)}
.media-title-area{display:flex;align-items:flex-start;gap:12px;font-size:17px;margin-bottom:5px}.media-title-area i{margin-top:4px}.file-path-subtext{display:block;color:var(--muted);font:13px/1.5 ui-monospace,Consolas,monospace;overflow-wrap:anywhere;margin-top:4px}
.platform-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:17px;min-width:0}
.platform-badge{border:1px solid rgba(98,114,164,.25);border-top:3px solid var(--platform);border-radius:9px;background:#1b1d28;padding:12px;min-width:0}
.badge-plex{--platform:#e5a93b}.badge-kodi{--platform:#1cbdff}.badge-jellyfin{--platform:#a855f7}
.platform-badge i{color:var(--platform)}.badge-value{display:block;margin-top:4px;font-size:16px;font-weight:700}.timestamp-val{color:var(--muted);font:13px ui-monospace,Consolas,monospace}
.status-tag{display:inline-block;margin-top:8px;padding:4px 8px;border-radius:99px;font-size:12px}
.progress-wrapper{height:6px;border-radius:10px;background:#343746;overflow:hidden;margin-top:9px}.progress-bar{height:100%;border-radius:10px;background:var(--platform)}
@media(max-width:720px){.platform-grid{grid-template-columns:1fr}.fullscreen-panel{padding:16px}.panel-title{align-items:flex-start}h1{font-size:23px}}

/* Shared dashboard chrome and iframe-safe content sizing. */
html,body{width:100%;min-width:0}
.page-top{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:19px 26px;border-bottom:1px solid #44475a;background:rgba(33,34,44,.94)}
.page-top .brand{min-width:0}
.page-actions,.page-nav{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.page-actions button,.status-dialog button{padding:9px 13px;border:1px solid rgba(98,114,164,.5);border-radius:10px;background:linear-gradient(#36384a,#2a2d3c);color:var(--text);font:700 14px system-ui;cursor:pointer}
.page-actions button{margin:0;min-height:40px}
.page-actions button.primary{background:linear-gradient(#c49dff,#a57bf6);border-color:#c49dff;color:#171720}
.page-actions .danger{color:#ffb6b6}
.page-actions .subtle{background:transparent}
.page-nav{padding:11px 26px;gap:6px;border-bottom:1px solid rgba(98,114,164,.3);background:rgba(31,33,48,.68)}
.page-nav a{display:inline-block;border-radius:8px;padding:8px 13px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:700}
.page-nav a:hover,.page-nav a[aria-current="page"]{background:#3a3b52;color:var(--text)}
.page-nav a[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--purple)}
.status-dialog{width:min(720px,calc(100vw - 32px));max-height:80vh;overflow:auto;border:1px solid #6272a4;border-radius:14px;background:#21222c;color:var(--text);padding:20px}
.status-dialog::backdrop{background:rgba(0,0,0,.65)}
.status-dialog pre{max-width:100%;overflow:auto;padding:14px;border-radius:9px;background:#181922;font:13px/1.5 ui-monospace,Consolas,monospace}
.status-dialog .dialog-actions{display:flex;justify-content:flex-end;gap:8px}
@media(max-width:560px){.page-top,.page-nav{padding-left:16px;padding-right:16px}.page-top h1{font-size:23px}}
</style>
</head>
<body>

<header class="page-top"><div class="brand"><div class="logo-frame"><img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2232%22%20height%3D%2232%22%20viewBox%3D%220%200%2032%2032%22%20role%3D%22img%22%20aria-labelledby%3D%22title%22%3E%0A%20%20%3Ctitle%20id%3D%22title%22%3EPlex%20Kodi%20Jellyfin%20Sync%20icon%3C%2Ftitle%3E%0A%20%20%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%23101827%22%2F%3E%0A%20%20%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%2211.3%22%20fill%3D%22none%22%20stroke%3D%22%23253247%22%20stroke-width%3D%223%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M16%204.7a11.3%2011.3%200%200%201%209.8%205.65%22%20fill%3D%22none%22%20stroke%3D%22%23e5a72d%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M25.8%2021.65A11.3%2011.3%200%200%201%206.2%2021.65%22%20fill%3D%22none%22%20stroke%3D%22%238e69de%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M6.2%2010.35A11.3%2011.3%200%200%201%2011.6%205.6%22%20fill%3D%22none%22%20stroke%3D%22%2331a5df%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M13%2010.7%2021.5%2016%2013%2021.3Z%22%20fill%3D%22%23f5f8ff%22%2F%3E%0A%3C%2Fsvg%3E%0A" width="44" height="44" alt="Plex Kodi Jellyfin Sync logo"></div><div><div class="eyebrow">Plex · Kodi · Jellyfin</div><h1>Sync Dashboard</h1></div></div><div class="page-actions"><button type="button" class="primary" onclick="runSyncAction('sync')">Sync now</button><button type="button" class="danger" onclick="runSyncAction('reset')">Reset</button></div></header>
<nav class="page-nav" aria-label="Pages"><a href="/" aria-current="page">Dashboard</a><a href="/logs">Logs</a><a href="/status-page">Status</a><a href="/env">Env</a></nav>
    <div class="fullscreen-panel">
        
        <div class="media-status-list" id="statusViewContainer">
            <div style="color: #949eb4; text-align: center; padding: 100px 0; font-size: 1rem;">
                <i class="fa-solid fa-circle-nodes" style="font-size: 2.5rem; margin-bottom:12px; display:block; color: #a855f7;"></i>
                Querying media server resume status matrices...
            </div>
        </div>
    </div>

    <!-- Data Engine Parser Scripts -->
    <script>
        // Strict title sanitizer that removes folders, hashes, codecs, and release group endings
        function cleanMediaTitle(pathString) {
            if (!pathString) return "Unknown Title";
            
            // 1. Grab only the final filename after the last forward slash
            const parts = pathString.split('/');
            let fileName = parts[parts.length - 1];
            
            // 2. Drop the file extension (.mkv, .mp4, etc.)
            fileName = fileName.replace(/\.[^/.]+$/, "");
            
            // 3. Completely strip structural tracker ID blocks like {tmdb-123} or {edition-IMAX}
            fileName = fileName.replace(/\{.*?\}/g, "");
            
            // 4. Strip everything between brackets [Remux-2160p...] AND anything that follows it to the end of the string
            fileName = fileName.replace(/\[.*$/, "");
            
            // 5. Clean up stray leading/trailing hyphens, duplicate spaces, or trailing symbols
            fileName = fileName.replace(/\s+-\s*$/, "");
            fileName = fileName.replace(/\s+/g, " ");
            
            return fileName.trim();
        }

        function formatTime(seconds) {
            if (!seconds || isNaN(seconds)) return "0:00";
            const hrs = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);
            
            if (hrs > 0) {
                return `${hrs}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function generatePlatformWidget(platformData, type, isEpisode) {
            if (!platformData) {
                return `
                    <div class="platform-badge badge-${type}">
                        <div><i class="${type === 'plex' ? 'fa-solid fa-server' : type === 'jellyfin' ? 'fa-solid fa-server' : 'fa-solid fa-server'}"></i> ${type.toUpperCase()}</div>
                        <span class="status-tag" style="background: rgba(255,255,255,0.05); color: #6272a4; margin-top: auto;">Unlinked</span>
                    </div>`;
            }

            const isUnwatched = platformData.status === "unwatched" || !platformData.resume;
            const pct = isUnwatched ? 0 : Math.min(100, ((platformData.resume / platformData.duration) * 100).toFixed(1));
            const zeroProgressLabel = platformData.status === "watched" ? "Watched"
                : isEpisode && platformData.status === "unwatched" ? "Up Next" : "Unwatched";
            
            return `
                <div class="platform-badge badge-${type}">
                    <div style="text-transform: capitalize; font-weight:600;"><i class="${type === 'plex' ? 'fa-solid fa-server' : type === 'jellyfin' ? 'fa-solid fa-server' : 'fa-solid fa-server'}"></i> ${type}</div>
                    <div class="badge-value">${isUnwatched ? zeroProgressLabel : formatTime(platformData.resume)}</div>
                    <div class="timestamp-val">of ${formatTime(platformData.duration)}</div>
                    <div class="progress-wrapper">
                        <div class="progress-bar bar-${type}" style="width: ${pct}%"></div>
                    </div>
                    <span class="timestamp-val" style="margin-top: 2px;">${pct}% Complete</span>
                </div>
            `;
        }

        function fetchStatus() {
            fetch('/status', { credentials: 'include' })
            .then(r => r.json())
            .then(res => {

                const container = document.getElementById("statusViewContainer");

                if (!res.data || Object.keys(res.data).length === 0) {
                    container.innerHTML = `
                    <div style="color:#949eb4;text-align:center;padding:100px 0;font-size:1rem;">
                        <i class="fa-solid fa-circle-nodes"
                           style="font-size:2rem;margin-bottom:12px;display:block;"></i>
                        No synchronization logs mapped inside state telemetry file.
                    </div>`;
                    return;
                }

                container.innerHTML = "";

                const inProgress = [];
                const upNext = [];

                Object.keys(res.data).forEach(rawPath => {

                    const entry = res.data[rawPath];

                    const platforms = [
                        entry.plex,
                        entry.kodi,
                        entry.jellyfin
                    ].filter(Boolean);
                    const isEpisode = platforms.some(platform => platform.media_type === "episode");

                    const hasResume = platforms.some(platform =>
                        platform.resume &&
                        platform.resume > 0 &&
                        platform.status !== "watched"
                    );

                    if (hasResume) {
                        inProgress.push([rawPath, entry]);
                    } else if (isEpisode && platforms.some(platform =>
                        platform.status === "unwatched"
                    ) && platforms.every(platform => platform.status !== "watched")) {
                        upNext.push([rawPath, entry]);
                    }

                });


                function renderSection(title, cssClass, items) {

                    if (!items.length)
                        return;

                    const header = document.createElement("div");
                    header.className = `section-header ${cssClass}`;
                    header.textContent = `${title} (${items.length})`;

                    container.appendChild(header);


                    items.forEach(([rawPath, entry]) => {

                        const displayTitle = cleanMediaTitle(rawPath);
                        const isEpisode = [entry.plex, entry.kodi, entry.jellyfin]
                            .some(platform => platform && platform.media_type === "episode");

                        const row = document.createElement("div");
                        row.className = "media-row";

                        row.innerHTML = `
                            <div class="media-title-area">

                                <i class="${isEpisode 
                                ? 'fa-solid fa-tv' 
                                : 'fa-solid fa-film'}"
                                style="color:#FF79C6;font-size:1.25rem;"></i>

                                <div style="flex-grow:1;">
                                    <strong>${displayTitle}</strong>
                                    <span class="file-path-subtext">
                                        ${rawPath}
                                    </span>
                                </div>

                            </div>

                            <div class="platform-grid">

                                ${generatePlatformWidget(entry.plex,'plex',isEpisode)}

                                ${generatePlatformWidget(entry.kodi,'kodi',isEpisode)}

                                ${generatePlatformWidget(entry.jellyfin,'jellyfin',isEpisode)}

                            </div>
                        `;

                        container.appendChild(row);

                    });
                }


                renderSection(
                    "In Progress",
                    "inprogress",
                    inProgress
                );


                renderSection(
                    "Up Next",
                    "upnext",
                    upNext
                );


            })
            .catch(err => {

                document.getElementById("statusViewContainer").innerHTML =
                `
                <div style="color:#ff5555;text-align:center;padding:100px 0;font-size:1.1rem;">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    Communication connection with background engine severed.
                </div>
                `;

            });
        }

        fetchStatus();
    </script>
<script>
function syncLogColumns() {
 const content = document.querySelector('main') || document.querySelector('.fullscreen-panel');
 const gutter = content ? parseFloat(getComputedStyle(content).paddingLeft) || 0 : 26;
 const canvas = document.createElement('canvas');
 const context = canvas.getContext('2d');
 if (!context) return 80;
 context.font = '13px ui-monospace, SFMono-Regular, Consolas, monospace';
 const characterWidth = Math.max(1, context.measureText('M').width);
 // Match Dashboard: main gutter, card padding, and log padding/borders.
 const available = document.documentElement.clientWidth - gutter * 2 - 34 - 28 - 4;
 return Math.max(60, Math.min(240, Math.floor(available / characterWidth) - 1));
}
async function runSyncAction(action) {
 const button = document.querySelector('.page-actions .' + (action === 'sync' ? 'primary' : 'danger'));
 button.disabled = true;
 try {
  const response = await fetch('/' + action + '?columns=' + syncLogColumns(), {credentials:'include'});
  if (!response.ok) throw new Error('HTTP ' + response.status);
  if (typeof fetchStatus === 'function') fetchStatus();
 } catch (error) {
  alert('Unable to ' + action + ': ' + error.message);
 } finally { button.disabled = false; }
}

</script>
</body>
</html>
