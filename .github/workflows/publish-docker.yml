name: Publish Docker Hub image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-docker.yml
      - .dockerignore
      - Dockerfile
      - entrypoint.sh
      - requirements.txt
      - app/**

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Sign in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: lamb0985
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            lamb0985/plexkodijellyfinsync:latest
            lamb0985/plexkodijellyfinsync:sha-${{ github.sha }}
